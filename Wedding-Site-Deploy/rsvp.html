<div class="page-header">
  <h1>RSVP</h1>
  <span class="kicker kicker-below">The Couple Asks That You Kindly Respond<br>By August 1st, 2027</span>
  <span class="divider-mark"></span>
</div>

<main class="wrap main--roomy">
  <!--
    ============================================================
    HOW THIS WORKS — Netlify Forms
    ============================================================
    This form uses Netlify's built-in form handling — no external
    service, API key, or backend code needed. Netlify automatically
    detects any form with data-netlify="true" during deploy and
    starts collecting submissions.

    WHERE RESPONSES SHOW UP:
      Netlify dashboard → your site → Forms → "rsvp"
      From there you can export everything as a CSV, which opens
      directly in Excel.

    TO ADD/REMOVE A QUESTION:
      Copy or delete a <div class="form-group">...</div> block below.
      Just make sure every input/select/textarea has a unique "name"
      attribute — that's what becomes the column header in your export.

    TO CHANGE WHERE PEOPLE LAND AFTER SUBMITTING:
      Edit the message inside thank-you.html.

    ============================================================
    HOW THE GUEST LIMIT WORKS
    ============================================================
    Open guest-list.json — it's a simple list like this:
      {
        "name": "Jane Smith",
        "aliases": ["Janie Smith", "Jane Doe-Smith"],
        "maxGuests": 2
      }
    Add one entry per invitation (not per person — a family invited
    together is ONE entry with maxGuests set to their party size).

    ALIASES: if someone might type a nickname, maiden name, or
    slightly different spelling of their invite, list every variant
    in "aliases" — all of them will match this same entry and share
    the same maxGuests. Leave it as an empty array [] if you don't
    need any (like the "Noah Cain" example below).

    When someone types a name here matching the primary name OR any
    alias (case-insensitive), the "Number of Guests" field automatically
    caps at their allowed party size, and a small note confirms it.
    If their name doesn't match anything in the list, the field just
    stays capped at 1 by default — worth mentioning on the page or in
    your invites that names should be entered exactly as addressed.

    Note: this is a soft/browser-side limit, not a hard server-side
    rule — realistically fine for a wedding guest list, but flagging
    it so you know the honest scope of what this does.
    ============================================================
  -->
  <form
    name="rsvp"
    method="POST"
    action="/thank-you.html"
    data-netlify="true"
    data-netlify-honeypot="bot-field"
    class="rsvp-form"
    id="rsvp-form"
  >
    <input type="hidden" name="form-name" value="rsvp">
    <p class="hidden-field">
      <label>Don't fill this out if you're human: <input name="bot-field"></label>
    </p>

    <div class="form-group">
      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="Full Name" list="guest-options" autocomplete="off" required>
      <datalist id="guest-options"></datalist>
      <p class="field-note" id="guest-note"></p>
    </div>

    <div class="form-group">
      <label>Will You Be Attending?</label>
      <div class="radio-row">
        <label class="radio-option">
          <input type="radio" name="Attending" value="Joyfully Accepts" required>
          Joyfully Accepts
        </label>
        <label class="radio-option">
          <input type="radio" name="Attending" value="Regretfully Declines" required>
          Regretfully Declines
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="guest-count">Number of Guests (including yourself)</label>
      <input type="number" id="guest-count" name="Number of Guests" min="1" max="1" value="1">
    </div>

    <!--
      Pre-rendered additional guest name fields (hidden by default).
      These exist statically in the HTML so Netlify's form detection
      picks them all up at deploy time — JS below only shows/hides
      them based on the guest count, it never creates or removes them.

      Covers invitations up to 10 total guests. If you ever need a
      bigger party size, copy one of these blocks, bump the numbers
      (id, for, name, data-guest-index) to the next number, and add
      it here.
    -->
    <div class="form-group guest-field-hidden" data-guest-index="2">
      <label for="guest-name-2">Guest 2 Name</label>
      <input type="text" id="guest-name-2" name="Guest 2 Name">
    </div>
    <div class="form-group guest-field-hidden" data-guest-index="3">
      <label for="guest-name-3">Guest 3 Name</label>
      <input type="text" id="guest-name-3" name="Guest 3 Name">
    </div>
    <div class="form-group guest-field-hidden" data-guest-index="4">
      <label for="guest-name-4">Guest 4 Name</label>
      <input type="text" id="guest-name-4" name="Guest 4 Name">
    </div>
    <div class="form-group guest-field-hidden" data-guest-index="5">
      <label for="guest-name-5">Guest 5 Name</label>
      <input type="text" id="guest-name-5" name="Guest 5 Name">
    </div>
    <div class="form-group guest-field-hidden" data-guest-index="6">
      <label for="guest-name-6">Guest 6 Name</label>
      <input type="text" id="guest-name-6" name="Guest 6 Name">
    </div>
    <div class="form-group guest-field-hidden" data-guest-index="7">
      <label for="guest-name-7">Guest 7 Name</label>
      <input type="text" id="guest-name-7" name="Guest 7 Name">
    </div>
    <div class="form-group guest-field-hidden" data-guest-index="8">
      <label for="guest-name-8">Guest 8 Name</label>
      <input type="text" id="guest-name-8" name="Guest 8 Name">
    </div>
    <div class="form-group guest-field-hidden" data-guest-index="9">
      <label for="guest-name-9">Guest 9 Name</label>
      <input type="text" id="guest-name-9" name="Guest 9 Name">
    </div>
    <div class="form-group guest-field-hidden" data-guest-index="10">
      <label for="guest-name-10">Guest 10 Name</label>
      <input type="text" id="guest-name-10" name="Guest 10 Name">
    </div>

    <div class="form-group">
      <label for="allergies">Allergies / Dietary Restrictions</label>
      <input type="text" id="allergies" name="Allergies" placeholder="e.g. peanuts, gluten-free, vegetarian">
    </div>

    <div class="form-group">
      <label for="notes">What Song(s) Would Get You On the Dance Floor?</label>
      <textarea id="notes" name="Song Requests" rows="4"></textarea>
    </div>

    <button type="submit">Submit RSVP</button>
  </form>
</main>

<script>
  // Loads guest-list.json and, as someone types their name, caps the
  // "Number of Guests" field at their invitation's party size, then
  // reveals the matching number of "Guest N Name" fields (which already
  // exist in the HTML, just hidden — see the big comment above them).
  // Edit guest-list.json (not this script) to update names.
  (function () {
    var nameInput = document.getElementById('full-name');
    var guestInput = document.getElementById('guest-count');
    var guestNote = document.getElementById('guest-note');
    var datalist = document.getElementById('guest-options');
    var guestFields = document.querySelectorAll('[data-guest-index]');

    function updateVisibleGuestFields() {
      var count = parseInt(guestInput.value, 10) || 1;
      var max = parseInt(guestInput.max, 10) || 1;
      if (count > max) count = max;
      if (count < 1) count = 1;

      guestFields.forEach(function (field) {
        var index = parseInt(field.getAttribute('data-guest-index'), 10);
        var input = field.querySelector('input');
        if (index <= count) {
          field.classList.remove('guest-field-hidden');
          input.required = true;
        } else {
          field.classList.add('guest-field-hidden');
          input.required = false;
          input.value = ''; // clear so stale names don't get submitted
        }
      });
    }

    fetch('guest-list.json')
      .then(function (res) { return res.json(); })
      .then(function (guestList) {
        // Populate the autocomplete suggestions — includes the primary
        // name AND every alias, so guests can find themselves by
        // nickname or however their invite lists them.
        guestList.forEach(function (entry) {
          var namesToList = [entry.name].concat(entry.aliases || []);
          namesToList.forEach(function (n) {
            var option = document.createElement('option');
            option.value = n;
            datalist.appendChild(option);
          });
        });

        // Finds the guest-list entry matching a typed name, checking
        // both the primary name and any aliases (case-insensitive).
        function findMatch(typedName) {
          return guestList.find(function (entry) {
            var candidates = [entry.name].concat(entry.aliases || []);
            return candidates.some(function (n) {
              return n.trim().toLowerCase() === typedName;
            });
          });
        }

        function applyGuestLimit() {
          var typedName = nameInput.value.trim().toLowerCase();
          var match = findMatch(typedName);

          if (match) {
            guestInput.max = match.maxGuests;
            if (parseInt(guestInput.value, 10) > match.maxGuests) {
              guestInput.value = match.maxGuests;
            }
            guestNote.textContent = 'Your invitation includes up to ' + match.maxGuests + ' guest' + (match.maxGuests === 1 ? '' : 's') + '.';
          } else {
            guestInput.max = 1;
            if (parseInt(guestInput.value, 10) > 1) guestInput.value = 1;
            guestNote.textContent = typedName ? "We couldn't find this name on our guest list — please enter it exactly as it appears on your invitation." : '';
          }
          updateVisibleGuestFields();
        }

        nameInput.addEventListener('input', applyGuestLimit);
        nameInput.addEventListener('blur', applyGuestLimit);

        guestInput.addEventListener('input', function () {
          var max = parseInt(guestInput.max, 10) || 1;
          if (parseInt(guestInput.value, 10) > max) {
            guestInput.value = max;
          }
          updateVisibleGuestFields();
        });
        guestInput.addEventListener('change', updateVisibleGuestFields);
      })
      .catch(function () {
        // If the guest list fails to load for any reason, don't block
        // the form — just leave the default limit in place.
        console.warn('Could not load guest-list.json; guest limit not applied.');
      });
  })();
</script>
